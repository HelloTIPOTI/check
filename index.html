<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>출석체크</title>
	<link rel="icon" type="image/png" href="https://raw.githubusercontent.com/HelloTIPOTI/check/main/check.png">
    <style>
        :root {
            --bg-color: #f4f6f9;
            --card-bg: #ffffff;
            --text-main: #2c3e50;
            --text-sub: #7f8c8d;
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --success: #10b981;
            --border-color: #e5e7eb;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }

        [data-theme="dark"] {
            --bg-color: #111827;
            --card-bg: #1f2937;
            --text-main: #f3f4f6;
            --text-sub: #9ca3af;
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --success: #34d399;
            --border-color: #374151;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            transition: background-color 0.3s, color 0.3s;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 20px;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 480px;
            margin: 0 auto;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 700;
        }

        .date-badge {
            font-size: 0.9rem;
            color: var(--text-sub);
            font-weight: 500;
            margin-top: 4px;
        }

        .header-btns {
            display: flex;
            gap: 8px;
        }

        .icon-btn {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            width: 40px;
            height: 40px;
            border-radius: 10px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: var(--shadow);
            font-size: 1.1rem;
        }

        .icon-btn:active {
            transform: scale(0.95);
        }

        /* Tab Navigation Bar */
        .tab-nav {
            display: flex;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 4px;
            margin-bottom: 20px;
            box-shadow: var(--shadow);
        }

        .tab-btn {
            flex: 1;
            background: transparent;
            border: none;
            padding: 10px;
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--text-sub);
            border-radius: 8px;
            cursor: pointer;
        }

        .tab-btn.active {
            background: var(--primary);
            color: white;
            box-shadow: var(--shadow);
        }

        .view-section {
            display: none;
        }

        .view-section.active {
            display: block;
        }

        /* Progress Card */
        .progress-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 16px 20px;
            margin-bottom: 20px;
            box-shadow: var(--shadow);
        }

        .progress-info {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 0.9rem;
            font-weight: 600;
        }

        .progress-bar-bg {
            width: 100%;
            height: 10px;
            background-color: var(--border-color);
            border-radius: 5px;
            overflow: hidden;
        }

        .progress-bar-fill {
            height: 100%;
            background-color: var(--success);
            width: 0%;
            transition: width 0.4s ease;
        }

        /* Group & Site List */
        .group-section {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            margin-bottom: 14px;
            overflow: hidden;
            box-shadow: var(--shadow);
        }

        .group-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            background: var(--bg-color);
            border-bottom: 1px solid var(--border-color);
            cursor: pointer;
            user-select: none;
        }

        .group-title {
            font-size: 0.95rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .group-toggle-icon {
            font-size: 0.8rem;
            transition: transform 0.2s;
        }

        .group-section.collapsed .group-toggle-icon {
            transform: rotate(-90deg);
        }

        .group-section.collapsed .group-body {
            display: none;
        }

        .group-body {
            display: flex;
            flex-direction: column;
            gap: 8px;
            padding: 12px;
        }

        .site-card {
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 12px 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .site-info {
            display: flex;
            align-items: center;
            gap: 12px;
            flex: 1;
            cursor: pointer;
        }

        .site-checkbox {
            width: 20px;
            height: 20px;
            accent-color: var(--success);
            cursor: pointer;
        }

        .site-name {
            font-size: 0.95rem;
            font-weight: 600;
        }

        .site-card.completed .site-name {
            text-decoration: line-through;
            color: var(--text-sub);
        }

        .site-actions {
            display: flex;
            gap: 6px;
        }

        .btn-link {
            background-color: var(--card-bg);
            color: var(--primary);
            border: 1px solid var(--border-color);
            padding: 5px 10px;
            border-radius: 6px;
            font-size: 0.8rem;
            font-weight: 600;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            cursor: pointer;
        }

        .btn-link:hover {
            background-color: var(--primary);
            color: #fff;
            border-color: var(--primary);
        }

        /* Controls / Buttons */
        .action-row {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .btn-primary {
            flex: 1;
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: var(--shadow);
        }

        .btn-primary:hover {
            background-color: var(--primary-hover);
        }

        .btn-secondary {
            background-color: var(--card-bg);
            color: var(--text-main);
            border: 1px solid var(--border-color);
            padding: 12px 16px;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: var(--shadow);
        }

        /* Calendar & Stats View */
        .stats-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: var(--shadow);
        }

        .calendar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .calendar-header h3 {
            font-size: 1.1rem;
            font-weight: 700;
        }

        .cal-nav-btn {
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            width: 32px;
            height: 32px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }

        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 6px;
            text-align: center;
        }

        .calendar-day-name {
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--text-sub);
            padding-bottom: 6px;
        }

        .calendar-cell {
            aspect-ratio: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-radius: 8px;
            font-size: 0.85rem;
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            position: relative;
            cursor: pointer;
        }

        .calendar-cell:hover {
            border-color: var(--primary);
        }

        .calendar-cell.has-attendance {
            background-color: rgba(16, 185, 129, 0.15);
            border-color: var(--success);
            color: var(--success);
            font-weight: bold;
        }

        .calendar-cell.empty {
            background: transparent;
            border: none;
            cursor: default;
        }

        .monthly-summary-text {
            margin-top: 16px;
            font-size: 0.9rem;
            color: var(--text-sub);
            text-align: center;
            font-weight: 500;
        }

        /* Modal / Settings */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
            padding: 20px;
            z-index: 100;
        }

        .modal.open {
            display: flex;
        }

        .modal-content {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 24px;
            width: 100%;
            max-width: 400px;
            box-shadow: var(--shadow);
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal-title {
            font-size: 1.2rem;
            font-weight: 700;
            margin-bottom: 16px;
        }

        .form-group {
            margin-bottom: 14px;
        }

        .form-group label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 6px;
            color: var(--text-sub);
        }

        .form-input, .form-select {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid var(--border-color);
            background: var(--bg-color);
            color: var(--text-main);
            border-radius: 8px;
            font-size: 0.9rem;
        }

        .modal-buttons {
            display: flex;
            gap: 8px;
            margin-top: 20px;
        }

        /* Add site form */
        .add-site-container {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 16px;
            margin-bottom: 20px;
            box-shadow: var(--shadow);
        }

        .add-site-container h3 {
            font-size: 0.95rem;
            margin-bottom: 10px;
        }

        .add-row {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .add-row-inputs {
            display: flex;
            gap: 6px;
        }
    </style>
</head>
<body data-theme="light">
    <div class="container">
        <header>
            <div>
                <h1>✨ 출석체크</h1>
                <div class="date-badge" id="current-date-text"></div>
            </div>
            <div class="header-btns">
                <button class="icon-btn" id="theme-toggle-btn" title="테마 변경">🌙</button>
                <button class="icon-btn" id="settings-btn" title="GitHub 연동 설정">⚙️</button>
            </div>
        </header>

        <!-- Tab Navigation -->
        <div class="tab-nav">
            <button class="tab-btn active" id="tab-today-btn" onclick="switchView('today')">📅 오늘의 출석</button>
            <button class="tab-btn" id="tab-stats-btn" onclick="switchView('stats')">📊 월별 통계</button>
        </div>

        <!-- VIEW 1: TODAY CHECK -->
        <div class="view-section active" id="view-today">
            <!-- Progress Card -->
            <div class="progress-card">
                <div class="progress-info">
                    <span>오늘의 출석 달성률</span>
                    <span id="progress-text">0 / 0 (0%)</span>
                </div>
                <div class="progress-bar-bg">
                    <div class="progress-bar-fill" id="progress-fill"></div>
                </div>
            </div>

            <!-- Group & Site List Container -->
            <div id="group-list-container">
                <!-- Dynamic groups and sites will be inserted here -->
            </div>

            <!-- Add New Site Form -->
            <div class="add-site-container">
                <h3>➕ 새 출석 사이트 추가</h3>
                <div class="add-row">
                    <div class="add-row-inputs">
                        <input type="text" id="new-site-name" class="form-input" placeholder="사이트 이름" style="flex: 1.2;">
                        <input type="text" id="new-site-group" class="form-input" placeholder="그룹명 (예: 쇼핑, 포인트)" style="flex: 1;">
                    </div>
                    <div class="add-row-inputs">
                        <input type="text" id="new-site-url" class="form-input" placeholder="주소 (https://...)">
                        <button class="btn-primary" id="add-site-btn" style="flex: 0 0 70px; padding: 10px;">추가</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- VIEW 2: MONTHLY STATS & CALENDAR -->
        <div class="view-section" id="view-stats">
            <div class="stats-card">
                <div class="calendar-header">
                    <button class="cal-nav-btn" onclick="changeMonth(-1)">&lt;</button>
                    <h3 id="calendar-title">2026년 9월</h3>
                    <button class="cal-nav-btn" onclick="changeMonth(1)">&gt;</button>
                </div>
                <div class="calendar-grid">
                    <div class="calendar-day-name" style="color: #ef4444;">일</div>
                    <div class="calendar-day-name">월</div>
                    <div class="calendar-day-name">화</div>
                    <div class="calendar-day-name">수</div>
                    <div class="calendar-day-name">목</div>
                    <div class="calendar-day-name">금</div>
                    <div class="calendar-day-name" style="color: #3b82f6;">토</div>
                </div>
                <div class="calendar-grid" id="calendar-cells" style="margin-top: 6px;">
                    <!-- Calendar days rendered dynamically -->
                </div>
                <div class="monthly-summary-text" id="monthly-summary-text">
                    이번 달 총 출석 일수: 0일
                </div>
                <div style="font-size: 0.75rem; color: var(--text-sub); text-align: center; margin-top: 8px;">
                    * 날짜를 클릭하면 해당 날짜의 출석체크 상세 내역을 보거나 체크할 수 있습니다.
                </div>
            </div>
        </div>

        <div class="action-row">
            <button class="btn-primary" id="sync-github-btn">☁️ 깃허브 동기화</button>
            <button class="btn-secondary" id="reset-today-btn">🔄 오늘 초기화</button>
        </div>
    </div>

    <!-- Edit Site Modal -->
    <div class="modal" id="edit-site-modal">
        <div class="modal-content">
            <div class="modal-title">✏️ 사이트 정보 수정</div>
            <input type="hidden" id="edit-site-id">
            <div class="form-group">
                <label for="edit-site-name">사이트 이름</label>
                <input type="text" id="edit-site-name" class="form-input">
            </div>
            <div class="form-group">
                <label for="edit-site-group">그룹명</label>
                <input type="text" id="edit-site-group" class="form-input">
            </div>
            <div class="form-group">
                <label for="edit-site-url">주소 (URL)</label>
                <input type="text" id="edit-site-url" class="form-input">
            </div>
            <div class="modal-buttons">
                <button class="btn-secondary" id="edit-modal-close-btn" style="flex: 1;">취소</button>
                <button class="btn-primary" id="edit-modal-save-btn" style="flex: 1;">저장</button>
            </div>
        </div>
    </div>

    <!-- Date Detail / Check Modal -->
    <div class="modal" id="date-detail-modal">
        <div class="modal-content">
            <div class="modal-title" id="date-detail-title">2026-09-07 상세 정보</div>
            <div id="date-detail-list" style="display: flex; flex-direction: column; gap: 8px; max-height: 50vh; overflow-y: auto;">
                <!-- Dynamically loaded list of sites for this date -->
            </div>
            <div class="modal-buttons">
                <button class="btn-primary" id="date-detail-close-btn" style="width: 100%;">닫기</button>
            </div>
        </div>
    </div>

    <!-- Settings Modal for GitHub Gist -->
    <div class="modal" id="settings-modal">
        <div class="modal-content">
            <div class="modal-title">⚙️ GitHub Gist 연동 설정</div>
            <div style="font-size: 0.85rem; color: var(--text-sub); margin-bottom: 14px; line-height: 1.4;">
                GitHub Gist를 활용하면 PC와 스마트폰 간에 출석체크 기록이 실시간으로 연동됩니다.
            </div>
            <div class="form-group">
                <label for="gist-token">GitHub Personal Access Token (gist 권한)</label>
                <input type="password" id="gist-token" class="form-input" placeholder="ghp_xxxxxxxxxxxx">
            </div>
            <div class="form-group">
                <label for="gist-id">Gist ID</label>
                <input type="text" id="gist-id" class="form-input" placeholder="32자리 문자열">
            </div>
            <div class="modal-buttons">
                <button class="btn-secondary" id="modal-close-btn" style="flex: 1;">취소</button>
                <button class="btn-primary" id="modal-save-btn" style="flex: 1;">저장 및 연동</button>
            </div>
        </div>
    </div>

    <script>
        let sites = JSON.parse(localStorage.getItem('att_sites')) || [
            { id: 1, name: '네이버페이 출석체크', group: '포인트', url: 'https://new-m.pay.naver.com/pc/benefit' },
            { id: 2, name: '토스 행운퀴즈 / 출석', group: '포인트', url: 'https://toss.im' },
            { id: 3, name: '올리브영 출석체크', group: '쇼핑', url: 'https://www.oliveyoung.co.kr' }
        ];

        let records = JSON.parse(localStorage.getItem('att_records')) || {};
        let collapsedGroups = JSON.parse(localStorage.getItem('att_collapsed_groups')) || {};

        function getTodayKey() {
            const now = new Date();
            const year = now.getFullYear();
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const day = String(now.getDate()).padStart(2, '0');
            return `${year}-${month}-${day}`;
        }

        function getFormattedDateText() {
            const now = new Date();
            const days = ['일', '월', '화', '수', '목', '금', '토'];
            return `${now.getFullYear()}년 ${now.getMonth() + 1}월 ${now.getDate()}일 (${days[now.getDay()]})`;
        }

        document.getElementById('current-date-text').textContent = getFormattedDateText();

        const todayKey = getTodayKey();
        if (!records[todayKey]) {
            records[todayKey] = [];
        }

        let currentCalendarDate = new Date();

        function switchView(viewName) {
            document.getElementById('view-today').classList.remove('active');
            document.getElementById('view-stats').classList.remove('active');
            document.getElementById('tab-today-btn').classList.remove('active');
            document.getElementById('tab-stats-btn').classList.remove('active');

            if (viewName === 'today') {
                document.getElementById('view-today').classList.add('active');
                document.getElementById('tab-today-btn').classList.add('active');
            } else {
                document.getElementById('view-stats').classList.add('active');
                document.getElementById('tab-stats-btn').classList.add('active');
                renderCalendar();
            }
        }

        function changeMonth(direction) {
            currentCalendarDate.setMonth(currentCalendarDate.getMonth() + direction);
            renderCalendar();
        }

        function renderCalendar() {
            const year = currentCalendarDate.getFullYear();
            const month = currentCalendarDate.getMonth(); // 0-11
            document.getElementById('calendar-title').textContent = `${year}년 ${month + 1}월`;

            const cellsContainer = document.getElementById('calendar-cells');
            cellsContainer.innerHTML = '';

            const firstDayIndex = new Date(year, month, 1).getDay();
            const lastDay = new Date(year, month + 1, 0).getDate();

            for (let i = 0; i < firstDayIndex; i++) {
                const emptyCell = document.createElement('div');
                emptyCell.className = 'calendar-cell empty';
                cellsContainer.appendChild(emptyCell);
            }

            let monthlyAttendanceCount = 0;

            for (let day = 1; day <= lastDay; day++) {
                const cell = document.createElement('div');
                cell.className = 'calendar-cell';
                
                const mm = String(month + 1).padStart(2, '0');
                const dd = String(day).padStart(2, '0');
                const dateKey = `${year}-${mm}-${dd}`;

                cell.textContent = day;

                const checkedList = records[dateKey] || [];
                if (checkedList.length > 0) {
                    cell.classList.add('has-attendance');
                    monthlyAttendanceCount++;
                }

                cell.addEventListener('click', () => openDateDetailModal(dateKey));

                cellsContainer.appendChild(cell);
            }

            document.getElementById('monthly-summary-text').textContent = 
                `${year}년 ${month + 1}월 총 출석 일수: ${monthlyAttendanceCount}일`;
        }

        // Render UI
        function render() {
            const container = document.getElementById('group-list-container');
            container.innerHTML = '';

            const todayCheckedList = records[todayKey] || [];
            let completedCount = 0;
            const total = sites.length;

            // Group sites by group name
            const grouped = {};
            sites.forEach(site => {
                const groupName = site.group || '기타';
                if (!grouped[groupName]) grouped[groupName] = [];
                grouped[groupName].push(site);
            });

            Object.keys(grouped).forEach(groupName => {
                const groupSites = grouped[groupName];
                const isCollapsed = !!collapsedGroups[groupName];

                const groupSection = document.createElement('div');
                groupSection.className = `group-section ${isCollapsed ? 'collapsed' : ''}`;

                const groupHeader = document.createElement('div');
                groupHeader.className = 'group-header';
                groupHeader.innerHTML = `
                    <div class="group-title">
                        <span class="group-toggle-icon">▼</span>
                        <span>${groupName} (${groupSites.length})</span>
                    </div>
                `;
                groupHeader.addEventListener('click', () => {
                    collapsedGroups[groupName] = !isCollapsed;
                    localStorage.setItem('att_collapsed_groups', JSON.stringify(collapsedGroups));
                    render();
                });

                const groupBody = document.createElement('div');
                groupBody.className = 'group-body';

                groupSites.forEach(site => {
                    const isChecked = todayCheckedList.includes(site.id);
                    if (isChecked) completedCount++;

                    const card = document.createElement('div');
                    card.className = `site-card ${isChecked ? 'completed' : ''}`;
                    card.innerHTML = `
                        <div class="site-info" onclick="toggleCheck(${site.id}, '${todayKey}')">
                            <input type="checkbox" class="site-checkbox" ${isChecked ? 'checked' : ''} onclick="event.stopPropagation(); toggleCheck(${site.id}, '${todayKey}')">
                            <span class="site-name">${site.name}</span>
                        </div>
                        <div class="site-actions">
                            <a href="${site.url}" target="_blank" class="btn-link" onclick="event.stopPropagation();">바로가기 ↗</a>
                            <button class="btn-link" style="color: var(--primary);" onclick="openEditModal(${site.id}, event)" title="수정">수정</button>
                            <button class="btn-link" style="color: #ef4444; border-color: #fecaca; background: transparent;" onclick="deleteSite(${site.id}, event)" title="삭제">삭제</button>
                        </div>
                    `;
                    groupBody.appendChild(card);
                });

                groupSection.appendChild(groupHeader);
                groupSection.appendChild(groupBody);
                container.appendChild(groupSection);
            });

            const percent = total > 0 ? Math.round((completedCount / total) * 100) : 0;
            document.getElementById('progress-text').textContent = `${completedCount} / ${total} (${percent}%)`;
            document.getElementById('progress-fill').style.width = `${percent}%`;

            localStorage.setItem('att_sites', JSON.stringify(sites));
            localStorage.setItem('att_records', JSON.stringify(records));
        }

        function toggleCheck(siteId, dateKey = todayKey) {
            if (!records[dateKey]) {
                records[dateKey] = [];
            }
            const index = records[dateKey].indexOf(siteId);
            if (index > -1) {
                records[dateKey].splice(index, 1);
            } else {
                records[dateKey].push(siteId);
            }
            render();
            if (dateKey === todayKey) {
                autoSyncGitHub();
            }
        }

        function deleteSite(siteId, event) {
            event.stopPropagation();
            if (confirm('이 사이트를 목록에서 삭제하시겠습니까?')) {
                sites = sites.filter(s => s.id !== siteId);
                render();
            }
        }

        // Add site
        document.getElementById('add-site-btn').addEventListener('click', () => {
            const nameInput = document.getElementById('new-site-name');
            const groupInput = document.getElementById('new-site-group');
            const urlInput = document.getElementById('new-site-url');
            const name = nameInput.value.trim();
            const group = groupInput.value.trim() || '기타';
            let url = urlInput.value.trim();

            if (!name) {
                alert('사이트 이름을 입력해주세요.');
                return;
            }
            if (url && !url.startsWith('http://') && !url.startsWith('https://')) {
                url = 'https://' + url;
            }

            const newSite = {
                id: Date.now(),
                name: name,
                group: group,
                url: url || '#'
            };

            sites.push(newSite);
            nameInput.value = '';
            groupInput.value = '';
            urlInput.value = '';
            render();
            autoSyncGitHub();
        });

        // Edit site modal
        const editSiteModal = document.getElementById('edit-site-modal');
        function openEditModal(siteId, event) {
            event.stopPropagation();
            const site = sites.find(s => s.id === siteId);
            if (!site) return;

            document.getElementById('edit-site-id').value = site.id;
            document.getElementById('edit-site-name').value = site.name;
            document.getElementById('edit-site-group').value = site.group || '기타';
            document.getElementById('edit-site-url').value = site.url;
            editSiteModal.classList.add('open');
        }

        document.getElementById('edit-modal-close-btn').addEventListener('click', () => {
            editSiteModal.classList.remove('open');
        });

        document.getElementById('edit-modal-save-btn').addEventListener('click', () => {
            const siteId = Number(document.getElementById('edit-site-id').value);
            const name = document.getElementById('edit-site-name').value.trim();
            const group = document.getElementById('edit-site-group').value.trim() || '기타';
            let url = document.getElementById('edit-site-url').value.trim();

            if (!name) {
                alert('사이트 이름을 입력해주세요.');
                return;
            }
            if (url && !url.startsWith('http://') && !url.startsWith('https://')) {
                url = 'https://' + url;
            }

            const site = sites.find(s => s.id === siteId);
            if (site) {
                site.name = name;
                site.group = group;
                site.url = url || '#';
            }

            editSiteModal.classList.remove('open');
            render();
            autoSyncGitHub();
        });

        // Date Detail / Check Modal
        const dateDetailModal = document.getElementById('date-detail-modal');
        function openDateDetailModal(dateKey) {
            document.getElementById('date-detail-title').textContent = `${dateKey} 출석체크 상세`;
            const listContainer = document.getElementById('date-detail-list');
            listContainer.innerHTML = '';

            const checkedSites = records[dateKey] || [];

            sites.forEach(site => {
                const isChecked = checkedSites.includes(site.id);
                const item = document.createElement('div');
                item.className = `site-card ${isChecked ? 'completed' : ''}`;
                item.innerHTML = `
                    <div class="site-info" onclick="toggleCheck(${site.id}, '${dateKey}'); openDateDetailModal('${dateKey}');">
                        <input type="checkbox" class="site-checkbox" ${isChecked ? 'checked' : ''} onclick="event.stopPropagation(); toggleCheck(${site.id}, '${dateKey}'); openDateDetailModal('${dateKey}');">
                        <span class="site-name">${site.name} <small style="color:var(--text-sub);">[${site.group || '기타'}]</small></span>
                    </div>
                `;
                listContainer.appendChild(item);
            });

            dateDetailModal.classList.add('open');
        }

        document.getElementById('date-detail-close-btn').addEventListener('click', () => {
            dateDetailModal.classList.remove('open');
            renderCalendar();
        });

        document.getElementById('reset-today-btn').addEventListener('click', () => {
            if (confirm('오늘 출석 체크 내역을 초기화하시겠습니까?')) {
                records[todayKey] = [];
                render();
                autoSyncGitHub();
            }
        });

        // Theme Toggle
        const themeToggleBtn = document.getElementById('theme-toggle-btn');
        let currentTheme = localStorage.getItem('att_theme') || 'light';
        document.body.setAttribute('data-theme', currentTheme);
        themeToggleBtn.textContent = currentTheme === 'dark' ? '☀️' : '🌙';

        themeToggleBtn.addEventListener('click', () => {
            currentTheme = currentTheme === 'light' ? 'dark' : 'light';
            document.body.setAttribute('data-theme', currentTheme);
            themeToggleBtn.textContent = currentTheme === 'dark' ? '☀️' : '🌙';
            localStorage.setItem('att_theme', currentTheme);
        });

        // Settings Modal
        const settingsModal = document.getElementById('settings-modal');
        document.getElementById('settings-btn').addEventListener('click', () => {
            document.getElementById('gist-token').value = localStorage.getItem('att_gist_token') || '';
            document.getElementById('gist-id').value = localStorage.getItem('att_gist_id') || '';
            settingsModal.classList.add('open');
        });

        document.getElementById('modal-close-btn').addEventListener('click', () => {
            settingsModal.classList.remove('open');
        });

        document.getElementById('modal-save-btn').addEventListener('click', () => {
            const token = document.getElementById('gist-token').value.trim();
            const gistId = document.getElementById('gist-id').value.trim();
            localStorage.setItem('att_gist_token', token);
            localStorage.setItem('att_gist_id', gistId);
            settingsModal.classList.remove('open');
            alert('설정이 저장되었습니다!');
        });

        // GitHub Gist Sync Logic (수정된 부분)
        async function syncWithGitHub(isManual = true) {
            const token = localStorage.getItem('att_gist_token');
            if (!token) {
                if (isManual) {
                    alert('먼저 우측 상단 ⚙️ 설정에서 GitHub 토큰을 입력해주세요.');
                    settingsModal.classList.add('open');
                }
                return;
            }

            let gistId = localStorage.getItem('att_gist_id');
            const dataToSync = { sites: sites, records: records, collapsedGroups: collapsedGroups };
            const filesData = {
                "attendance_data.json": { content: JSON.stringify(dataToSync, null, 2) }
            };

            try {
                if (!gistId) {
                    const response = await fetch('https://api.github.com/gists', {
                        method: 'POST',
                        headers: {
                            'Authorization': `token ${token}`,
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({
                            description: "Attendance Check Data Storage",
                            public: false,
                            files: filesData
                        })
                    });
                    const resJson = await response.json();
                    if (resJson.id) {
                        gistId = resJson.id;
                        localStorage.setItem('att_gist_id', gistId);
                        if (isManual) alert('깃허브 Gist 생성 및 데이터 저장 성공!');
                    } else {
                        throw new Error(resJson.message || 'Gist 생성 실패');
                    }
                } else {
                    // 서버에서 데이터로 덮어쓰던 GET 로직 제거 후 바로 PATCH (로컬 데이터 우선 반영)
                    const updateRes = await fetch(`https://api.github.com/gists/${gistId}`, {
                        method: 'PATCH',
                        headers: {
                            'Authorization': `token ${token}`,
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({
                            description: "Attendance Check Data Storage",
                            files: {
                                "attendance_data.json": {
                                    content: JSON.stringify({ sites, records, collapsedGroups }, null, 2)
                                }
                            }
                        })
                    });

                    if (updateRes.ok) {
                        if (isManual) alert('깃허브 동기화 완료!');
                    } else {
                        throw new Error('Gist 업데이트 실패');
                    }
                }
            } catch (err) {
                console.error(err);
                if (isManual) alert('동기화 중 오류가 발생했습니다: ' + err.message);
            }
        }

        document.getElementById('sync-github-btn').addEventListener('click', () => syncWithGitHub(true));

        function autoSyncGitHub() {
            const token = localStorage.getItem('att_gist_token');
            if (token) {
                syncWithGitHub(false);
            }
        }

        window.addEventListener('load', () => {
            const token = localStorage.getItem('att_gist_token');
            const gistId = localStorage.getItem('att_gist_id');
            if (token && gistId) {
                fetch(`https://api.github.com/gists/${gistId}`, {
                    headers: { 'Authorization': `token ${token}` }
                })
                .then(res => res.json())
                .then(data => {
                    if (data.files && data.files['attendance_data.json']) {
                        const remote = JSON.parse(data.files['attendance_data.json'].content);
                        if (remote.sites) sites = remote.sites;
                        if (remote.collapsedGroups) collapsedGroups = remote.collapsedGroups;
                        if (remote.records) {
                            for (let k in remote.records) {
                                if (!records[k]) records[k] = remote.records[k];
                                else records[k] = Array.from(new Set([...records[k], ...remote.records[k]]));
                            }
                        }
                        render();
                    }
                }).catch(e => console.log('Auto fetch failed:', e));
            }
            render();
        });
    </script>
</body>
</html>
