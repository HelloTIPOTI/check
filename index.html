<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>출석체크</title>
    <style>
        :root {
            --bg-color: #f4f6f9;
            --card-bg: #ffffff;
            --text-main: #2c3e50;
            --text-sub: #7f8c8d;
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --success: #10b981;
            --border-color: #e5e7eb;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }

        [data-theme="dark"] {
            --bg-color: #111827;
            --card-bg: #1f2937;
            --text-main: #f3f4f6;
            --text-sub: #9ca3af;
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --success: #34d399;
            --border-color: #374151;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            transition: background-color 0.3s, color 0.3s;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 20px;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 480px;
            margin: 0 auto;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 700;
        }

        .date-badge {
            font-size: 0.9rem;
            color: var(--text-sub);
            font-weight: 500;
            margin-top: 4px;
        }

        .header-btns {
            display: flex;
            gap: 8px;
        }

        .icon-btn {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            width: 40px;
            height: 40px;
            border-radius: 10px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: var(--shadow);
            font-size: 1.1rem;
        }

        .icon-btn:active {
            transform: scale(0.95);
        }

        /* Progress Bar */
        .progress-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 16px 20px;
            margin-bottom: 20px;
            box-shadow: var(--shadow);
        }

        .progress-info {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 0.9rem;
            font-weight: 600;
        }

        .progress-bar-bg {
            width: 100%;
            height: 10px;
            background-color: var(--border-color);
            border-radius: 5px;
            overflow: hidden;
        }

        .progress-bar-fill {
            height: 100%;
            background-color: var(--success);
            width: 0%;
            transition: width 0.4s ease;
        }

        /* Site List */
        .site-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 20px;
        }

        .site-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 14px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: var(--shadow);
        }

        .site-info {
            display: flex;
            align-items: center;
            gap: 12px;
            flex: 1;
            cursor: pointer;
        }

        .site-checkbox {
            width: 22px;
            height: 22px;
            accent-color: var(--success);
            cursor: pointer;
        }

        .site-name {
            font-size: 1rem;
            font-weight: 600;
        }

        .site-card.completed .site-name {
            text-decoration: line-through;
            color: var(--text-sub);
        }

        .site-actions {
            display: flex;
            gap: 8px;
        }

        .btn-link {
            background-color: var(--bg-color);
            color: var(--primary);
            border: 1px solid var(--border-color);
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: 600;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
        }

        .btn-link:hover {
            background-color: var(--primary);
            color: #fff;
            border-color: var(--primary);
        }

        /* Controls / Buttons */
        .action-row {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .btn-primary {
            flex: 1;
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: var(--shadow);
        }

        .btn-primary:hover {
            background-color: var(--primary-hover);
        }

        .btn-secondary {
            background-color: var(--card-bg);
            color: var(--text-main);
            border: 1px solid var(--border-color);
            padding: 12px 16px;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: var(--shadow);
        }

        /* Modal / Settings */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
            padding: 20px;
            z-index: 100;
        }

        .modal.open {
            display: flex;
        }

        .modal-content {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 24px;
            width: 100%;
            max-width: 400px;
            box-shadow: var(--shadow);
        }

        .modal-title {
            font-size: 1.2rem;
            font-weight: 700;
            margin-bottom: 16px;
        }

        .form-group {
            margin-bottom: 14px;
        }

        .form-group label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 6px;
            color: var(--text-sub);
        }

        .form-input {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid var(--border-color);
            background: var(--bg-color);
            color: var(--text-main);
            border-radius: 8px;
            font-size: 0.9rem;
        }

        .modal-buttons {
            display: flex;
            gap: 8px;
            margin-top: 20px;
        }

        /* Add site form */
        .add-site-container {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 16px;
            margin-bottom: 20px;
            box-shadow: var(--shadow);
        }

        .add-site-container h3 {
            font-size: 0.95rem;
            margin-bottom: 10px;
        }

        .add-row {
            display: flex;
            gap: 8px;
        }

        .add-row input {
            flex: 1;
        }
    </style>
</head>
<body data-theme="light">
    <div class="container">
        <header>
            <div>
                <h1>✨ 출석체크</h1>
                <div class="date-badge" id="current-date-text">2026년 9월 7일 월요일</div>
            </div>
            <div class="header-btns">
                <button class="icon-btn" id="theme-toggle-btn" title="테마 변경">🌙</button>
                <button class="icon-btn" id="settings-btn" title="GitHub 연동 설정">⚙️</button>
            </div>
        </header>

        <!-- Progress Card -->
        <div class="progress-card">
            <div class="progress-info">
                <span>오늘의 출석 달성률</span>
                <span id="progress-text">0 / 0 (0%)</span>
            </div>
            <div class="progress-bar-bg">
                <div class="progress-bar-fill" id="progress-fill"></div>
            </div>
        </div>

        <!-- Site List -->
        <div class="site-list" id="site-list-container">
            <!-- Dynamic sites will be inserted here -->
        </div>

        <!-- Add New Site Form -->
        <div class="add-site-container">
            <h3>➕ 새 출석 사이트 추가</h3>
            <div class="add-row">
                <input type="text" id="new-site-name" class="form-input" placeholder="사이트 이름 (예: 네이버 페이)">
                <input type="text" id="new-site-url" class="form-input" placeholder="주소 (https://...)">
                <button class="btn-primary" id="add-site-btn" style="flex: 0 0 70px; padding: 10px;">추가</button>
            </div>
        </div>

        <div class="action-row">
            <button class="btn-primary" id="sync-github-btn">☁️ 깃허브 동기화</button>
            <button class="btn-secondary" id="reset-today-btn">🔄 오늘 초기화</button>
        </div>
    </div>

    <!-- Settings Modal for GitHub Gist -->
    <div class="modal" id="settings-modal">
        <div class="modal-content">
            <div class="modal-title">⚙️ GitHub Gist 연동 설정</div>
            <div style="font-size: 0.85rem; color: var(--text-sub); margin-bottom: 14px; line-height: 1.4;">
                GitHub Gist를 활용하면 PC와 스마트폰 간에 출석체크 기록이 실시간으로 연동됩니다. (토큰 발급 방법은 가이드 참고)
            </div>
            <div class="form-group">
                <label for="gist-token">GitHub Personal Access Token (gist 권한)</label>
                <input type="password" id="gist-token" class="form-input" placeholder="ghp_xxxxxxxxxxxx">
            </div>
            <div class="form-group">
                <label for="gist-id">Gist ID (비워두면 자동 생성)</label>
                <input type="text" id="gist-id" class="form-input" placeholder="32자리 문자열">
            </div>
            <div class="modal-buttons">
                <button class="btn-secondary" id="modal-close-btn" style="flex: 1;">취소</button>
                <button class="btn-primary" id="modal-save-btn" style="flex: 1;">저장 및 연동</button>
            </div>
        </div>
    </div>

    <script>
        // Default initial sites if none exist
        let sites = JSON.parse(localStorage.getItem('att_sites')) || [
            { id: 1, name: '네이버페이 출석체크', url: 'https://new-m.pay.naver.com/pc/benefit' },
            { id: 2, name: '토스 행운퀴즈 / 출석', url: 'https://toss.im' },
            { id: 3, name: '올리브영 출석체크', url: 'https://www.oliveyoung.co.kr' }
        ];

        // Get today's date string format: YYYY-MM-DD
        function getTodayKey() {
            const now = new Date();
            const year = now.getFullYear();
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const day = String(now.getDate()).padStart(2, '0');
            return `${year}-${month}-${day}`;
        }

        function getFormattedDateText() {
            const now = new Date();
            const days = ['일', '월', '화', '수', '목', '금', '토'];
            return `${now.getFullYear()}년 ${now.getMonth() + 1}월 ${now.getDate()}일 (${days[now.getDay()]})`;
        }

        document.getElementById('current-date-text').textContent = getFormattedDateText();

        // Get attendance records: { "2026-03-30": [1, 2], ... }
        let records = JSON.parse(localStorage.getItem('att_records')) || {};
        const todayKey = getTodayKey();
        if (!records[todayKey]) {
            records[todayKey] = [];
        }

        // Render UI
        function render() {
            const container = document.getElementById('site-list-container');
            container.innerHTML = '';

            const todayCheckedList = records[todayKey] || [];
            let completedCount = 0;

            sites.forEach(site => {
                const isChecked = todayCheckedList.includes(site.id);
                if (isChecked) completedCount++;

                const card = document.createElement('div');
                card.className = `site-card ${isChecked ? 'completed' : ''}`;
                
                card.innerHTML = `
                    <div class="site-info" onclick="toggleCheck(${site.id})">
                        <input type="checkbox" class="site-checkbox" ${isChecked ? 'checked' : ''} onclick="event.stopPropagation(); toggleCheck(${site.id})">
                        <span class="site-name">${site.name}</span>
                    </div>
                    <div class="site-actions">
                        <a href="${site.url}" target="_blank" class="btn-link" onclick="event.stopPropagation();">바로가기 ↗</a>
                        <button class="btn-link" style="color: #ef4444; border-color: #fecaca; background: transparent;" onclick="deleteSite(${site.id}, event)" title="삭제">삭제</button>
                    </div>
                `;
                container.appendChild(card);
            });

            // Update progress bar
            const total = sites.length;
            const percent = total > 0 ? Math.round((completedCount / total) * 100) : 0;
            document.getElementById('progress-text').textContent = `${completedCount} / ${total} (${percent}%)`;
            document.getElementById('progress-fill').style.width = `${percent}%`;

            // Save to localStorage
            localStorage.setItem('att_sites', JSON.stringify(sites));
            localStorage.setItem('att_records', JSON.stringify(records));
        }

        function toggleCheck(siteId) {
            if (!records[todayKey]) {
                records[todayKey] = [];
            }
            const index = records[todayKey].indexOf(siteId);
            if (index > -1) {
                records[todayKey].splice(index, 1);
            } else {
                records[todayKey].push(siteId);
            }
            render();
            autoSyncGitHub(); // Try silent sync if token exists
        }

        function deleteSite(siteId, event) {
            event.stopPropagation();
            if (confirm('이 사이트를 목록에서 삭제하시겠습니까?')) {
                sites = sites.filter(s => s.id !== siteId);
                render();
            }
        }

        // Add site listener
        document.getElementById('add-site-btn').addEventListener('click', () => {
            const nameInput = document.getElementById('new-site-name');
            const urlInput = document.getElementById('new-site-url');
            const name = nameInput.value.trim();
            let url = urlInput.value.trim();

            if (!name) {
                alert('사이트 이름을 입력해주세요.');
                return;
            }
            if (url && !url.startsWith('http://') && !url.startsWith('https://')) {
                url = 'https://' + url;
            }

            const newSite = {
                id: Date.now(),
                name: name,
                url: url || '#'
            };

            sites.push(newSite);
            nameInput.value = '';
            urlInput.value = '';
            render();
        });

        // Reset today
        document.getElementById('reset-today-btn').addEventListener('click', () => {
            if (confirm('오늘 출석 체크 내역을 초기화하시겠습니까?')) {
                records[todayKey] = [];
                render();
            }
        });

        // Theme Toggle
        const themeToggleBtn = document.getElementById('theme-toggle-btn');
        let currentTheme = localStorage.getItem('att_theme') || 'light';
        document.body.setAttribute('data-theme', currentTheme);
        themeToggleBtn.textContent = currentTheme === 'dark' ? '☀️' : '🌙';

        themeToggleBtn.addEventListener('click', () => {
            currentTheme = currentTheme === 'light' ? 'dark' : 'light';
            document.body.setAttribute('data-theme', currentTheme);
            themeToggleBtn.textContent = currentTheme === 'dark' ? '☀️' : '🌙';
            localStorage.setItem('att_theme', currentTheme);
        });

        // GitHub Gist Settings Modal
        const settingsModal = document.getElementById('settings-modal');
        document.getElementById('settings-btn').addEventListener('click', () => {
            document.getElementById('gist-token').value = localStorage.getItem('att_gist_token') || '';
            document.getElementById('gist-id').value = localStorage.getItem('att_gist_id') || '';
            settingsModal.classList.add('open');
        });

        document.getElementById('modal-close-btn').addEventListener('click', () => {
            settingsModal.classList.remove('open');
        });

        document.getElementById('modal-save-btn').addEventListener('click', () => {
            const token = document.getElementById('gist-token').value.trim();
            const gistId = document.getElementById('gist-id').value.trim();
            localStorage.setItem('att_gist_token', token);
            localStorage.setItem('att_gist_id', gistId);
            settingsModal.classList.remove('open');
            alert('설정이 저장되었습니다! 이제 깃허브 동기화를 사용하실 수 있습니다.');
        });

        // GitHub Gist Sync Logic
        async function syncWithGitHub(isManual = true) {
            const token = localStorage.getItem('att_gist_token');
            if (!token) {
                if (isManual) {
                    alert('먼저 우측 상단 ⚙️ 설정에서 GitHub 토큰을 입력해주세요.');
                    settingsModal.classList.add('open');
                }
                return;
            }

            let gistId = localStorage.getItem('att_gist_id');
            const dataToSync = {
                sites: sites,
                records: records
            };

            const filesData = {
                "attendance_data.json": {
                    content: JSON.stringify(dataToSync, null, 2)
                }
            };

            try {
                if (!gistId) {
                    // Create new Gist
                    const response = await fetch('https://api.github.com/gists', {
                        method: 'POST',
                        headers: {
                            'Authorization': `token ${token}`,
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({
                            description: "Attendance Check Data Storage",
                            public: false,
                            files: filesData
                        })
                    });
                    const resJson = await response.json();
                    if (resJson.id) {
                        gistId = resJson.id;
                        localStorage.setItem('att_gist_id', gistId);
                        if (isManual) alert('깃허브 Gist 생성 및 데이터 저장 성공!');
                    } else {
                        throw new Error(resJson.message || 'Gist 생성 실패');
                    }
                } else {
                    // Update existing Gist (Fetch remote first to merge or overwrite)
                    // First, let's fetch remote to see if remote is newer or merge records
                    const getRes = await fetch(`https://api.github.com/gists/${gistId}`, {
                        headers: { 'Authorization': `token ${token}` }
                    });
                    if (getRes.ok) {
                        const gistJson = await getRes.json();
                        if (gistJson.files && gistJson.files['attendance_data.json']) {
                            const remoteContent = JSON.parse(gistJson.files['attendance_data.json'].content);
                            // Merge records (simple approach: union of checked items or take latest)
                            if (remoteContent.records) {
                                // Merge records keys
                                for (let dateKey in remoteContent.records) {
                                    if (!records[dateKey]) {
                                        records[dateKey] = remoteContent.records[dateKey];
                                    } else {
                                        // Merge array elements uniquely
                                        records[dateKey] = Array.from(new Set([...records[dateKey], ...remoteContent.records[dateKey]]));
                                    }
                                }
                            }
                            if (remoteContent.sites && remoteContent.sites.length > sites.length) {
                                sites = remoteContent.sites;
                            }
                        }
                    }

                    // Now push updated data back
                    const updateRes = await fetch(`https://api.github.com/gists/${gistId}`, {
                        method: 'PATCH',
                        headers: {
                            'Authorization': `token ${token}`,
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({
                            description: "Attendance Check Data Storage",
                            files: {
                                "attendance_data.json": {
                                    content: JSON.stringify({ sites, records }, null, 2)
                                }
                            }
                        })
                    });

                    if (updateRes.ok) {
                        render();
                        if (isManual) alert('깃허브 동기화 완료!');
                    } else {
                        throw new Error('Gist 업데이트 실패');
                    }
                }
            } catch (err) {
                console.error(err);
                if (isManual) alert('동기화 중 오류가 발생했습니다: ' + err.message);
            }
        }

        document.getElementById('sync-github-btn').addEventListener('click', () => syncWithGitHub(true));

        function autoSyncGitHub() {
            const token = localStorage.getItem('att_gist_token');
            if (token) {
                syncWithGitHub(false);
            }
        }

        // On load, try fetching latest data from GitHub if token & gistId exist
        window.addEventListener('load', () => {
            const token = localStorage.getItem('att_gist_token');
            const gistId = localStorage.getItem('att_gist_id');
            if (token && gistId) {
                fetch(`https://api.github.com/gists/${gistId}`, {
                    headers: { 'Authorization': `token ${token}` }
                })
                .then(res => res.json())
                .then(data => {
                    if (data.files && data.files['attendance_data.json']) {
                        const remote = JSON.parse(data.files['attendance_data.json'].content);
                        if (remote.sites) sites = remote.sites;
                        if (remote.records) {
                            for (let k in remote.records) {
                                if (!records[k]) records[k] = remote.records[k];
                                else records[k] = Array.from(new Set([...records[k], ...remote.records[k]]));
                            }
                        }
                        render();
                    }
                }).catch(e => console.log('Auto fetch failed:', e));
            }
            render();
        });
    </script>
</body>
</html>
